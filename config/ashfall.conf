# AshFall shared configuration (CONTRACT - change only via the orchestrator).
# Sourced as bash by scripts/lib/common.sh:load_config. Per-machine overrides go
# in config/ashfall.local.conf (gitignored), which is sourced afterwards.

# --- identity ---------------------------------------------------------------
ASH_NAME="AshFall"
ASH_VERSION="0.1.0-dev"

# --- target device (Retroid Pocket 5) ---------------------------------------
# SoC: Snapdragon 865 / SM8250 ("kona"), Adreno 650, stock kernel 5.15 GKI (community tree: 4.19), A/B,
# dynamic partitions (12 GiB super), boot header v4 (vendor_boot), stock
# Android 13 (qti/kona/kona:13/TKQ1.240621.001). Bootloader unlocked.
DEVICE_NAME="Retroid Pocket 5"
DEVICE_SOC="SM8250"
DEVICE_PLATFORM="kona"
DEVICE_FASTBOOT_PRODUCT="kona"           # `fastboot getvar product`

# --- source -----------------------------------------------------------------
LINEAGE_MANIFEST="https://github.com/LineageOS/android.git"
LINEAGE_BRANCH="lineage-24.0"            # Android 17
GSI_PRODUCT="ashfall_gsi_arm64"          # our product, inherits lineage_gsi_arm64
GSI_BASE_PRODUCT="lineage_gsi_arm64"
GSI_VARIANT="userdebug"
LUNCH_RELEASE=""                         # empty = auto-detect from tree (build.sh)

# --- stock firmware (reference only, never flash device-unique partitions) --
STOCK_FW_URL="https://github.com/TheGammaSqueeze/Retroid_Pocket_Stock_Firmware/releases/download/Android13_RP5_V1.0.0.31_20241026_190102_user/Android13_RP5_V1.0.0.31_20241026_190102_user.7z"
STOCK_FW_RELEASE_PAGE="https://github.com/TheGammaSqueeze/Retroid_Pocket_Stock_Firmware/releases/tag/Android13_RP5_V1.0.0.31_20241026_190102_user"

# --- build host (user's PC, Fedora Silverblue 45, Ryzen 7 7800X3D, 64 GB) ---
# Reached over SSH (Tailscale). All Android build work runs inside a dedicated
# distrobox container; nothing is installed on the immutable host.
BUILD_HOST="epickitrolaz@100.66.37.14"
BUILD_BOX="ashfall-build"                # distrobox container name
BUILD_BOX_IMAGE="docker.io/library/ubuntu:24.04"
# Remote layout (paths on the build host; $HOME is shared with the box):
REMOTE_ROOT="/var/home/epickitrolaz/ashfall"
REMOTE_SRC="${REMOTE_ROOT}/src/lineage"  # the ONE shared LineageOS tree
REMOTE_CCACHE="${REMOTE_ROOT}/ccache"
REMOTE_WS="${REMOTE_ROOT}/ws"            # rsynced copies of this repo, one per branch
REMOTE_ARTIFACTS="${REMOTE_ROOT}/artifacts"   # <build-id>/system.img etc.
REMOTE_LOGS="${REMOTE_ROOT}/logs"
REMOTE_FIRMWARE="${REMOTE_ROOT}/firmware"
REMOTE_TREE_LOCK="${REMOTE_ROOT}/.tree.lock"  # flock: anything that mutates REMOTE_SRC
CCACHE_SIZE="80G"
BUILD_JOBS="12"                          # 16 threads, but soong analysis alone peaks ~46 GB; 12 + 32 GB zram leaves headroom

# --- local (this repo's machine) --------------------------------------------
LOCAL_ARTIFACTS="${ASH_ROOT}/out"        # pulled images/logs land here (gitignored)

# --- vendor_boot artifact (phase 6 GPU OC) ----------------------------------
# The built vendor_boot image is published as a hash-pinned release in a
# separate artifact repository (private: it wraps stock vendor binaries).
# `scripts/device/flash-vendor-boot.sh --release` downloads, verifies and
# flashes the pinned tag; `scripts/gpu/publish-vendor_boot.sh` publishes a new
# one.  See the repo's README/PROVENANCE and docs/rp5/gpu.md.
VENDOR_BOOT_REPO="ashfall-rom/rp5-vendor_boot"
VENDOR_BOOT_TAG="vb-oc8-20261115"
VENDOR_BOOT_SHA256="804c2f088a9a16efb1f12775a80fb22b18da148f723f5fb1f64c9edca92f3eee"

